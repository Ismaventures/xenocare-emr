name: NDC EMR — CI / Build

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

# Cancel an in-flight run on the same branch when a newer commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. TypeScript type-check + lint
  # ============================================================================
  type-check:
    name: Type-check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ============================================================================
  # 2. Unit tests
  # ============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: type-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests --ci --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ============================================================================
  # 3. Migration file validation
  # ============================================================================
  validate-migrations:
    name: Validate Migration Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check migration file naming (sequential numbers only)
        shell: bash
        run: |
          echo "Checking migration file naming convention..."

          # Collect all migration filenames
          files=$(ls migrations/*.sql 2>/dev/null | xargs -n1 basename | sort)

          if [ -z "$files" ]; then
            echo "No migration files found — skipping check."
            exit 0
          fi

          # Verify each file starts with a numeric prefix
          bad_files=""
          for f in $files; do
            if ! echo "$f" | grep -qE '^[0-9]+_'; then
              bad_files="$bad_files $f"
            fi
          done

          if [ -n "$bad_files" ]; then
            echo "ERROR: Migration files must be named NNN_description.sql"
            echo "Bad files:$bad_files"
            exit 1
          fi

          echo "All $( echo "$files" | wc -l | tr -d ' ') migration files follow the naming convention."

      - name: Detect duplicate migration numbers
        shell: bash
        run: |
          echo "Checking for duplicate migration numbers..."
          
          # Extract numeric prefixes and check for duplicates
          dupes=$(ls migrations/*.sql 2>/dev/null \
            | xargs -n1 basename \
            | sed 's/^\([0-9]*\)_.*/\1/' \
            | sort \
            | uniq -d)

          if [ -n "$dupes" ]; then
            echo "ERROR: Duplicate migration number(s) detected: $dupes"
            exit 1
          fi

          echo "No duplicate migration numbers found."

      - name: Verify migrations only use IF NOT EXISTS / OR REPLACE
        shell: bash
        run: |
          echo "Scanning migrations for non-idempotent statements..."

          # Warn when ALTER TABLE without IF EXISTS is found (non-blocking for now)
          # Also warn on plain CREATE TABLE without IF NOT EXISTS
          problem_files=""
          for f in migrations/*.sql; do
            if grep -qiE '^[[:space:]]*(CREATE TABLE|CREATE INDEX|CREATE UNIQUE INDEX)[[:space:]]' "$f"; then
              if ! grep -qiE 'IF NOT EXISTS' "$f"; then
                problem_files="$problem_files\n  $f"
              fi
            fi
          done

          if [ -n "$problem_files" ]; then
            echo "WARNING: These migration files may have non-idempotent CREATE statements:"
            printf "$problem_files\n"
            echo "(This is a warning, not an error. Add IF NOT EXISTS to be safe.)"
          else
            echo "All checked migration files appear idempotent."
          fi

  # ============================================================================
  # 4. Electron production build (runs on main branch only)
  # ============================================================================
  build-electron:
    name: Electron Production Build
    runs-on: windows-latest
    needs: [type-check, test, validate-migrations]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Package Electron app (no publish)
        run: npm run package
        env:
          # Prevent electron-builder from trying to auto-publish
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndc-emr-windows-${{ github.run_number }}
          path: dist/
          retention-days: 30

  # ============================================================================
  # 5. Dependency audit (non-blocking advisory)
  # ============================================================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true   # Advisory only — don't fail the pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # Only report high/critical; don't fail CI
        run: npm audit --audit-level=high || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_number }}
          path: audit.json
          retention-days: 14
        continue-on-error: true
